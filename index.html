
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>ArteAnc VR - Catálogo interactivo</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
  <a-scene background="color: #E9E0D2">

    <!-- ILUMINACIÓN -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional"
             position="-2 5 3"
             intensity="1.2"></a-light>

    <!-- SUELO Y PARED -->
    <a-plane position="0 0 -3"
             rotation="-90 0 0"
             width="12"
             height="12"
             color="#786D63"></a-plane>

<!-- BALDOSAS DEL MUSEO -->
<a-entity id="baldosas"></a-entity>


    <a-box position="0 2 -6"
           width="12"
           height="4"
           depth="0.2"
           color="#D5C5B0"></a-box>

    <a-text value="ARTEANC"
            position="0 3 -5.85"
            align="center"
            color="#493021"
            width="5"></a-text>

            

<!-- Luz cálida para la vitrina central -->
<a-light
  type="point"
  position="0 2.8 -2.6"
  color="#FFF0D9"
  intensity="1.3"
  distance="5"
  decay="2">
</a-light>


<!-- DECORACION: PANELES DE EXHIBICION -->

<!-- Panel izquierdo -->
<a-box
  position="-2 1.85 -5.78"
  width="1.75"
  height="1.9"
  depth="0.05"
  color="#AF895F">
</a-box>

<a-plane
  position="-2 1.85 -5.72"
  width="1.65"
  height="1.8"
  color="#302A27">
</a-plane>

<!-- Panel central -->
<a-box
  position="0 1.85 -5.78"
  width="1.75"
  height="1.9"
  depth="0.05"
  color="#AF895F">
</a-box>

<a-plane
  position="0 1.85 -5.72"
  width="1.65"
  height="1.8"
  color="#302A27">
</a-plane>

<!-- Panel derecho -->
<a-box
  position="2 1.85 -5.78"
  width="1.75"
  height="1.9"
  depth="0.05"
  color="#AF895F">
</a-box>

<a-plane
  position="2 1.85 -5.72"
  width="1.65"
  height="1.8"
  color="#302A27">
</a-plane>


<!-- PARED IZQUIERDA -->
<a-box
  position="-5.95 2 -1.5"
  width="0.1"
  height="4"
  depth="9"
  color="#D5C5B0">
</a-box>

<!-- PARED DERECHA -->
<a-box
  position="5.95 2 -1.5"
  width="0.1"
  height="4"
  depth="9"
  color="#D5C5B0">
</a-box>


<!-- TECHO DE LA GALERIA -->
<a-box
  position="0 4.05 -1.5"
  width="12"
  height="0.12"
  depth="9"
  color="#E1D4C4">
</a-box>


<!-- ENTRADA PRINCIPAL -->

<!-- Pared frontal izquierda -->
<a-box
  position="-4 2 2.9"
  width="4"
  height="4"
  depth="0.16"
  color="#D5C5B0">
</a-box>

<!-- Pared frontal derecha -->
<a-box
  position="4 2 2.9"
  width="4"
  height="4"
  depth="0.16"
  color="#D5C5B0">
</a-box>

<!-- Parte superior de la entrada -->
<a-box
  position="0 3.5 2.9"
  width="4"
  height="1"
  depth="0.16"
  color="#D5C5B0">
</a-box>


<!-- RECEPCION ARTEANC VR -->

<!-- Cuerpo del mostrador -->
<a-box
  id="mostradorRecepcion"
  class="interactivo"
  position="-3.7 0.55 1.3"
  width="2"
  height="1.1"
  depth="0.75"
  color="#4B3429">
</a-box>

<!-- Superficie superior -->
<a-box
  position="-3.7 1.14 1.3"
  width="2.2"
  height="0.16"
  depth="0.9"
  color="#A98158">
</a-box>

<!-- Letrero frontal -->
<a-text
  value="ARTEANC"
  position="-3.7 0.75 0.91"
  align="center"
  width="2.5"
  color="#E8C99A">
</a-text>


<!-- PANEL DE BIENVENIDA -->
<!-- Letrero de mesa apoyado al fondo de la superficie del
     mostrador (superficie: y 1.06-1.22, z 0.85-1.75).
     Girado 180 grados para mirar hacia la galeria (-z),
     el mismo lado desde el que el visitante usa el mostrador.
     Base en y 1.25, borde superior en y 1.75. -->
<a-entity
  id="bienvenidaRecepcion"
  position="-3.7 1.5 1.55"
  rotation="0 180 0"
  visible="false">

  <!-- Marco de madera -->
  <a-box
    position="0 0 -0.025"
    width="1.4"
    height="0.6"
    depth="0.04"
    color="#A98158">
  </a-box>

  <!-- Fondo -->
  <a-plane
    width="1.3"
    height="0.5"
    color="#FFF4E6">
  </a-plane>

  <!-- Titulo -->
  <a-text
    value="BIENVENIDO A ARTEANC"
    position="0 0.14 0.01"
    align="center"
    width="1.2"
    color="#493021">
  </a-text>

  <!-- Instrucciones -->
  <a-text
    value="Explora nuestra galeria y selecciona una pieza para conocer su historia."
    position="0 -0.08 0.01"
    align="center"
    width="1.1"
    wrap-count="34"
    color="#493021">
  </a-text>

</a-entity>


<!-- PUERTAS CORREDIZAS ARTEANC -->

<!-- Puerta izquierda -->
<a-box
  id="puertaIzquierda"
  position="-1 1.45 2.74"
  width="1.92"
  height="2.9"
  depth="0.08"
  color="#674A37"
  animation__abrir="
    property: position;
    to: -3 1.45 2.74;
    dur: 750;
    startEvents: abrir"
  animation__cerrar="
    property: position;
    to: -1 1.45 2.74;
    dur: 750;
    startEvents: cerrar">
</a-box>

<!-- Puerta derecha -->
<a-box
  id="puertaDerecha"
  position="1 1.45 2.74"
  width="1.92"
  height="2.9"
  depth="0.08"
  color="#674A37"
  animation__abrir="
    property: position;
    to: 3 1.45 2.74;
    dur: 750;
    startEvents: abrir"
  animation__cerrar="
    property: position;
    to: 1 1.45 2.74;
    dur: 750;
    startEvents: cerrar">
</a-box>

<!-- Boton junto a la entrada -->
<a-box
  id="botonPuerta"
  class="interactivo"
  position="-2.45 1.45 2.65"
  width="0.85"
  height="0.32"
  depth="0.08"
  color="#A98158">
</a-box>

<a-text
  id="textoPuerta"
  value="ABRIR"
  position="-2.45 1.45 2.59"
  rotation="0 180 0"
  align="center"
  width="1.5"
  color="#FFFFFF">
</a-text>


<!-- BOTON EXTERIOR -->
<a-box
  id="botonPuertaExterior"
  class="interactivo"
  position="-2.45 1.45 3.07"
  width="0.85"
  height="0.32"
  depth="0.08"
  color="#A98158">
</a-box>

<!-- TEXTO EXTERIOR -->
<a-text
  id="textoPuertaExterior"
  value="ABRIR"
  position="-2.45 1.45 3.125"
  align="center"
  width="1.5"
  color="#FFFFFF">
</a-text>


    <!-- PEDESTALES -->
    <a-cylinder position="-2 0.5 -3.5"
                radius="0.65" height="1"
                color="#755C45"></a-cylinder>

    <a-cylinder position="0 0.5 -3.5"
                radius="0.65" height="1"
                color="#755C45"></a-cylinder>

          
<!-- PLACA INFORMATIVA DEL MONUMENTO -->
<a-plane
  position="0 0.68 -2.82"
  width="1"
  height="0.25"
  color="#302722">
</a-plane>

<a-text
  value="MONUMENTO HISTORICO"
  position="0 0.68 -2.805"
  align="center"
  width="1.25"
  color="#E9D3B3">
</a-text>
      

    <a-cylinder position="2 0.5 -3.5"
                radius="0.65" height="1"
                color="#755C45"></a-cylinder>

    <!-- PRODUCTO 1 -->
    <a-sphere id="pieza01"
              class="producto interactivo"
              position="-2 1.35 -3.5"
              radius="0.35"
              color="#C07746"></a-sphere>

    <!-- PRODUCTO 2 -->
      
<!-- PRODUCTO 2: MODELO 3D REAL -->
<a-entity
  id="pieza02"
  class="producto interactivo"
  gltf-model="url(./modelos/Untitle123d.glb)"
  position="0 0 -3.5"
  animation__girar="
    property: rotation;
    from: 0 0 0;
    to: 0 360 0;
    dur: 1200;
    startEvents: click">
</a-entity>


    <!-- PRODUCTO 3 -->
    <a-cone id="pieza03"
            class="producto interactivo"
            position="2 1.35 -3.5"
            radius-bottom="0.35"
            radius-top="0.1"
            height="0.7"
            color="#8A6650"></a-cone>

    <!-- FICHA ÚNICA -->
    <a-entity id="ficha"
              position="0 2.35 -3.05"
              visible="false">

      <a-plane width="2.8"
               height="1.45"
               color="#FFF4E6"></a-plane>

      <a-text id="nombre"
              position="-1.25 0.47 0.02"
              color="#493021"
              width="3"></a-text>

      <a-text id="precio"
              position="-1.25 0.15 0.02"
              color="#876142"
              width="2.8"></a-text>

      <a-text id="descripcion"
              position="-1.25 -0.13 0.02"
              color="#493021"
              width="2.4"
              wrap-count="42"></a-text>

      <!-- BOTÓN CERRAR -->
      <a-plane id="cerrarFicha"
               class="interactivo"
               position="0 -0.53 0.04"
               width="0.9"
               height="0.25"
               color="#795A44">

        <a-text value="CERRAR"
                position="0 0 0.02"
                align="center"
                color="white"
                width="1.8"></a-text>

      </a-plane>
    </a-entity>

    <!-- CÁMARA Y RATÓN -->
    
<!-- JUGADOR: CAMARA Y MANDOS -->
<a-entity id="jugador" caminar-quest teletransporte="mando: #mando-derecho" giro-por-pasos="mando: #mando-derecho">

  <!-- Camara -->
  <a-camera id="camara" position="0 1.6 0">
    <a-entity
      cursor="rayOrigin: mouse"
      raycaster="objects: .interactivo">
    </a-entity>
  </a-camera>

  <!-- Mando izquierdo: caminar con el joystick (caminar-quest) -->
  <a-entity
    id="mando-izquierdo"
    laser-controls="hand: left"
    raycaster="objects: .interactivo; far: 10">
  </a-entity>

  <!-- Mando derecho: gatillo = seleccionar; joystick adelante = teletransporte; a los lados = girar 30° -->
  <a-entity
    id="mando-derecho"
    laser-controls="hand: right"
    raycaster="objects: .interactivo; far: 10">
  </a-entity>

</a-entity>

  </a-scene>

  
<!-- Toda la lógica está en src/ (ver src/main.js) -->
<script type="module" src="./src/main.js"></script>

</body>
</html>
