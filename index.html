
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ArteAnc VR - Primera galería</title>

  <!-- Motor de realidad virtual -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>

<body>
  <a-scene background="color: #E9E0D2">

    <!-- Iluminación -->
    <a-light type="ambient"
             intensity="0.8"></a-light>

    <a-light type="directional"
             position="-2 5 3"
             intensity="1.2"></a-light>

    <!-- Suelo -->
    <a-plane position="0 0 -3"
             rotation="-90 0 0"
             width="12"
             height="12"
             color="#B7A48A"></a-plane>

    <!-- Pared del fondo -->
    <a-box position="0 2 -6"
           width="12"
           height="4"
           depth="0.2"
           color="#D5C5B0"></a-box>

    <!-- Nombre de la tienda -->
    <a-text value="ARTEANC"
            position="0 3 -5.85"
            align="center"
            color="#493021"
            width="5"></a-text>

    <a-text value="Galeria de arte ancestral"
            position="0 2.6 -5.85"
            align="center"
            color="#493021"
            width="3"></a-text>

    <!-- Primera vitrina -->
    <a-cylinder position="-2 0.5 -3.5"
                radius="0.65"
                height="1"
                color="#755C45"></a-cylinder>

    <a-sphere position="-2 1.35 -3.5"
              radius="0.35"
              color="#C07746"></a-sphere>

    <a-text value="Pieza 01"
            position="-2 1.95 -3.5"
            align="center"
            color="#3C291C"
            width="2"></a-text>

    <!-- Segunda vitrina -->
    <a-cylinder position="0 0.5 -3.5"
                radius="0.65"
                height="1"
                color="#755C45"></a-cylinder>

    <a-box position="0 1.35 -3.5"
           width="0.6"
           height="0.6"
           depth="0.6"
           color="#B48B60"></a-box>

    <a-text value="Pieza 02"
            position="0 1.95 -3.5"
            align="center"
            color="#3C291C"
            width="2"></a-text>

    <!-- Tercera vitrina -->
    <a-cylinder position="2 0.5 -3.5"
                radius="0.65"
                height="1"
                color="#755C45"></a-cylinder>

    <a-cone position="2 1.35 -3.5"
            radius-bottom="0.35"
            radius-top="0.1"
            height="0.7"
            color="#8A6650"></a-cone>

    <a-text value="Pieza 03"
            position="2 1.95 -3.5"
            align="center"
            color="#3C291C"
            width="2"></a-text>

    <!-- Vista inicial del visitante -->
    <a-entity position="0 0 0">
      <a-camera></a-camera>
    </a-entity>

  </a-scene>
</body>
</html>
