# PUBLICACIÓN AUTOMÁTICA - ARTEANC VR (módulo 0.6)
#
# Cada vez que se hace `git push` a `main`, GitHub ejecuta estos pasos en un
# servidor suyo: instala las dependencias, construye la web con Vite
# (`npm run build` → carpeta `dist/`) y publica `dist/` en GitHub Pages.
#
# Requisito (una sola vez): en GitHub, Settings → Pages → Build and deployment
# → Source: "GitHub Actions".
#
# El progreso se ve en la pestaña "Actions" del repositorio.

name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Permisos mínimos que necesita la publicación en Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos push seguidos, se publica solo el último
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v7

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (exactamente las de package-lock.json)
        run: npm ci

      - name: Construir la web con Vite
        run: npm run build

      - name: Preparar Pages
        uses: actions/configure-pages@v6

      - name: Subir la carpeta dist/
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v5
